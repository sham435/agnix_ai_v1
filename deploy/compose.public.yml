# compose.public.yml — isolated public/beta stack for shams ai.
# Companion to the architecture chosen on 2026-11-07: Docker Desktop hosts the
# public backend; Apache (mac) is the only public-facing origin in front of it;
# Cloudflare Tunnel fronts Apache; Bonsai stays a host-only service, reached
# from containers privately via host.docker.internal.
#
# Rules baked in here:
#  - Distinct project (name: shams-public), volumes and network: can never
#    collide with the dev compose stack (docker-compose.yml) or Homebrew PG.
#  - Nothing is published beyond 127.0.0.1 except the Rails app on 3002.
#    No host ports for Postgres, Redis, or job infrastructure.
#  - Containers run non-root (rails user from Dockerfile), read-only root
#    filesystem, no-new-privileges, all caps dropped, with resource limits.
#  - Bonsai access is private: host.docker.internal -> 127.0.0.1:8080/8910.
#    Never publish Bonsai; never route :8080 through the tunnel.

name: shams-public

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: shams
      POSTGRES_PASSWORD: ${SHAMS_PUBLIC_PG_PASSWORD:?SHAMS_PUBLIC_PG_PASSWORD required (public.env + --env-file)}
      POSTGRES_DB: shams_production
    volumes:
      # PG18+ image stores data under /var/lib/postgresql/<major>/docker; mount
      # the parent once (official recommendation) so pg_upgrade stays in-flow.
      - public_pgdata:/var/lib/postgresql
    tmpfs:
      - /tmp
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shams -d shams_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 2
    pids_limit: 200

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: shams-public-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /Users/sham4/.config/shams/public.env
    environment:
      PUMA_BIND_HOST: 0.0.0.0
      PORT: 3000
    # Image CMD references ./bin/thrust, which this repo never shipped; plain
    # PID-1 cluster-mode Puma is fine here (WEB_CONCURRENCY=0 by design).
    command: ["./bin/rails", "server"]
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - public_storage:/rails/storage
      - public_logs:/rails/log
    tmpfs:
      - /rails/tmp:size=192m,mode=1777
      - /tmp:size=128m,mode=1777
      - /home/rails:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 400
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/up"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  jobs:
    image: shams-public-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /Users/sham4/.config/shams/public.env
    entrypoint: ["/rails/bin/docker-entrypoint"]
    command: ["bin/jobs"]
    volumes:
      - public_storage:/rails/storage
      - public_logs:/rails/log
    tmpfs:
      - /rails/tmp:size=192m,mode=1777
      - /tmp:size=128m,mode=1777
      - /home/rails:size=64m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 300

volumes:
  public_pgdata:
  public_storage:
  public_logs:
