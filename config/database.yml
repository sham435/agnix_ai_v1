default: &default
  adapter: postgresql
  encoding: unicode
  pool: 10
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("PG_PORT", "5432") %>
  username: <%= ENV.fetch("PG_USER", "sham4") %>
  <% if ENV["PG_PASSWORD"].present? %>
  password: <%= ENV["PG_PASSWORD"] %>
  <% end %>
  prepared_statements: true

development:
  <<: *default
  database: shams_development

test:
  <<: *default
  database: shams_test

production:
  primary:
    <<: *default
    database: shams_production
    pool: 25
    url: <%= ENV["DATABASE_URL"] %>
  queue:
    <<: *default
    database: shams_production_queue
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: shams_production_cable
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
  cache:
    <<: *default
    database: shams_production_cache
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb

queue_development:
  <<: *default
  database: shams_development_queue

queue_test:
  <<: *default
  database: shams_test_queue

queue_production:
  <<: *default
  database: shams_production_queue
  url: <%= ENV["QUEUE_DATABASE_URL"] %>
