default: &default
  adapter: postgresql
  encoding: unicode
  pool: 10
  host: localhost
  port: 5432
  username: sham4
  prepared_statements: true

development:
  <<: *default
  database: shams_development

test:
  <<: *default
  database: shams_test

production:
  <<: *default
  database: shams_production
  pool: 25
  url: <%= ENV["DATABASE_URL"] %>

queue_development:
  <<: *default
  database: shams_development_queue

queue_test:
  <<: *default
  database: shams_test_queue

queue_production:
  <<: *default
  database: shams_production_queue
  url: <%= ENV["QUEUE_DATABASE_URL"] %>
